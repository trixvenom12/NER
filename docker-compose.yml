version: '3.8'

services:
  db:
    image: postgis/postgis:16-3.4
    environment: 
      - POSTGRES_PASSWORD=dev
      - POSTGRES_DB=ner
    ports: 
      - "5432:5432"
    volumes: 
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s

  api:
    build: ./api
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    environment: 
      - DATABASE_URL=postgresql+psycopg://postgres:dev@db:5432/ner
    volumes: 
      - ./api:/app
      - ./data:/data:ro
      - ./models:/models:ro
    ports: 
      - "8000:8000"
    depends_on: 
      db:
        condition: service_healthy

volumes:
  pgdata:
